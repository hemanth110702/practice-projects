name: Render Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url:
          - ${{ vars.GAMESTASH_HEALTH_POINT }}
          - ${{ vars.POCKETNOTES_HEALTH_POINT }}
    steps:
      - name: Ping endpoint
        run: curl -sSf ${{ matrix.url }} > /dev/null