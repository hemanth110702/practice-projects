name: Render Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GameStash
        run: curl -sSf ${{ secrets.GAMESTASH_HEALTH_POINT }} > /dev/null
        
      - name: Ping PocketNotes
        run: curl -sSf ${{ secrets.POCKETNOTES_HEALTH_POINT }} > /dev/null